name: SAST

# Static analysis of our Python source (Bandit): a fast pattern gate that runs
# entirely in CI and fails the job on findings. Data-flow analysis with results in
# the Security tab is CodeQL (codeql.yml); the two are complementary.
# Reviewed false-positives are suppressed inline with `# nosec <ID>` + reason.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      # Pinned in requirements-lint.txt; the scan command lives in `make bandit`
      # (the same target devs run locally - F-022a).
      - run: pip install -r requirements-lint.txt
      - name: Bandit (medium+ severity, medium+ confidence)
        run: make bandit
