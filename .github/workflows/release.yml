name: Release

# Versioned release: cut by pushing a semver tag (e.g. v0.5.0) or manually.
# Trivy gates the push: a vulnerable image is NEVER published.
# Phase 3 (spec 45): sign + attest + verify from outside.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v (e.g. 0.5.0)"
        required: true
        type: string

# Read-only by default (OpenSSF Scorecard Token-Permissions). Every write grant is
# declared on the one job that uses it: `publish` pushes/signs/attests, `github-release`
# is the ONLY job that can write to this repository (it creates the Release).
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─── Job 1: build → scan → push → sign → attest ───────────────────────────
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read        # checkout
      packages: write       # push to GHCR
      id-token: write       # cosign keyless (OIDC) + attestations
      attestations: write   # GitHub attestation API
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      image: ${{ steps.meta.outputs.image }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The dispatch input reaches the shell through env, never `${{ }}` inside `run:` (no
      # script injection), and is validated as semver because it ends up in tags and file names.
      - name: Resolve version
        id: ver
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            V="$INPUT_VERSION"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          if ! printf '%s' "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::not a semver version: '$V'"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Releasing version: $V"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          IMAGE="${IMAGE,,}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      # 1) Build single-arch for Trivy scan (no push).
      - name: Build (local, no push) for scan
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.meta.outputs.image }}:${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2) GATE — fail before any push if HIGH/CRITICAL CVEs.
      - name: Trivy scan (gate before push)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}:${{ steps.ver.outputs.version }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore.yaml

      # 3) Build multi-arch and PUSH (scan passed).
      - name: Build + push multi-arch
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.ver.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 4) Scan the PUSHED manifest (D9: close the scan/sign asymmetry).
      - name: Trivy scan pushed manifest (both architectures)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore.yaml

      # 5) Sign the manifest-list digest with cosign (keyless OIDC — D1).
      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Sign image
        run: cosign sign --yes "${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}"

      # 6) Build provenance attestation (D2 — GitHub-native).
      - name: Attest build provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # 7) SBOM attestation (feeds the SBOM Trivy already generates — D3/T3.3).
      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}
          format: cyclonedx
          output: sbom.cdx.json

      - name: Attest SBOM
        uses: actions/attest-sbom@5026d3663739160db546203eeaffa6aa1c51a4d6 # v1.4.1
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true

      # 8) Release assets that let a consumer verify WITHOUT registry access (spec 45 D3/T3.4,
      #    OpenSSF Scorecard Signed-Releases):
      #    - sbom.cdx.json.sigstore.json: keyless cosign signature (Sigstore bundle v0.3) over the
      #      SBOM file itself, same workflow identity as the image signature.
      #    - aigent-squad-<v>.intoto.jsonl: the build-provenance attestation produced in step 6
      #      (JSON Lines of Sigstore bundles wrapping the DSSE in-toto SLSA statement for the image
      #      digest). Exported, not regenerated — it is the same attestation pushed to GHCR.
      - name: Sign SBOM blob + export provenance bundle
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          cosign sign-blob --yes --new-bundle-format \
            --bundle sbom.cdx.json.sigstore.json sbom.cdx.json
          cp "$PROVENANCE_BUNDLE" "aigent-squad-${VERSION}.intoto.jsonl"

      - name: Upload release assets for the release job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: |
            sbom.cdx.json
            sbom.cdx.json.sigstore.json
            aigent-squad-${{ steps.ver.outputs.version }}.intoto.jsonl
          if-no-files-found: error
          retention-days: 7

  # ─── Job 2: verify from outside (T3.5) ────────────────────────────────────
  verify:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read        # checkout
      packages: read        # pull signatures/attestations from GHCR
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Login to GHCR (read-only, for pulling attestations)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Verify cosign signature (keyless — matches the workflow identity).
      - name: Verify signature
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github.com/StaffOps/aigent-squad/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${{ needs.publish.outputs.image }}@${{ needs.publish.outputs.digest }}"

      # Verify build provenance attestation.
      - name: Verify provenance attestation
        run: |
          gh attestation verify \
            "oci://${{ needs.publish.outputs.image }}@${{ needs.publish.outputs.digest }}" \
            --repo StaffOps/aigent-squad \
            --signer-workflow StaffOps/aigent-squad/.github/workflows/release.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Verify the release assets with the exact consumer commands from
      # docs/VERIFYING-RELEASES.md, so the first tag proves them BEFORE the Release
      # exists (github-release needs this job). Tag pushes only: a dispatch run's
      # certificate SAN is refs/heads/..., which the consumer regexp rejects by design.
      - name: Download release assets
        if: github.event_name == 'push'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets

      - name: Verify release assets (SBOM signature + provenance bundle)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.publish.outputs.version }}
          IMAGE_REF: ${{ needs.publish.outputs.image }}@${{ needs.publish.outputs.digest }}
        run: |
          cosign verify-blob \
            --new-bundle-format \
            --bundle sbom.cdx.json.sigstore.json \
            --certificate-identity-regexp '^https://github\.com/StaffOps/aigent-squad/\.github/workflows/release\.yml@refs/tags/v' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            sbom.cdx.json
          gh attestation verify "oci://${IMAGE_REF}" \
            --bundle "aigent-squad-${VERSION}.intoto.jsonl" \
            --repo StaffOps/aigent-squad

      # T3.6: Negative test — verify an unsigned image FAILS.
      - name: Negative test (must fail)
        run: |
          # Use a known-unsigned image (busybox) to prove verify rejects it.
          if cosign verify \
            --certificate-identity-regexp "^https://github.com/StaffOps/aigent-squad/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "ghcr.io/library/busybox:latest" 2>/dev/null; then
            echo "❌ NEGATIVE TEST FAILED: unsigned image passed verification"
            exit 1
          else
            echo "✅ Negative test passed: unsigned image correctly rejected"
          fi

  # ─── Job 3: GitHub Release (the only job with write access to the repo) ───
  # Runs after `verify`, so a Release is only created for an image that passed the
  # outside-in signature + provenance check.
  github-release:
    needs: [publish, verify]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the GitHub Release + attach assets
    steps:
      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ needs.publish.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            sbom.cdx.json
            sbom.cdx.json.sigstore.json
            aigent-squad-${{ needs.publish.outputs.version }}.intoto.jsonl
