name: Scorecard

# OpenSSF Scorecard — continuous, automated measurement of repository security hygiene
# (branch protection, pinned dependencies, token permissions, signed releases, …).
#
# Deliberately NOT a gate. Several checks are permanently unachievable here and gating on the
# score would encode that noise as policy:
#   - Contributors  → needs 3+ organisations in recent commits (we are one maintainer)
#   - Fuzzing       → no Python support in the check (only Go/JS/Haskell/Erlang/C# harnesses)
#   - Packaging     → does not recognise a direct Docker Hub push
# It is a visibility tool: the badge tells a prospective user what we look like from outside, and
# the SARIF upload puts regressions in the Security tab where they are noticed.
#
# Spec 45 T1.4/T1.5. All actions pinned by commit SHA (spec 45 T2.1) — a Scorecard workflow that
# itself used mutable refs would be self-refuting.

on:
  push:
    branches: [main]
  schedule:
    # Weekly. Scorecard results are only as fresh as the last run, and most checks change slowly.
    - cron: "27 4 * * 1"
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Upload the SARIF result to the Security tab.
      security-events: write
      # Required to publish results to the public API (and therefore to serve the badge).
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishes to api.securityscorecards.dev so the README badge resolves and anyone can
          # audit the score without asking us. Only meaningful for public repositories.
          publish_results: true

      # Kept for debugging a bad run: the SARIF is otherwise only visible after upload succeeds.
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          sarif_file: results.sarif
