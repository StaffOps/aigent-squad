name: Test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  # main accepts PRs ONLY from dev (branch protection can't enforce source branch).
  # Required check on main only — it won't run on dev PRs, so it never hangs them.
  guard:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Enforce PR source is dev
        run: |
          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "::error::main only accepts PRs from 'dev' (got '${{ github.head_ref }}')"
            exit 1
          fi
          echo "OK: PR from dev → main"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      # Same target devs/agents run locally (make lint) — spec 36 same-harness
      - run: make lint

  # Spec-status SSOT gate (spec 32) — frontmatter consistency; fast, no image build.
  specs_status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "pyyaml==6.0.2"
      # Same target devs/agents run locally (make specs-status) — spec 36 same-harness
      - run: make specs-status

  # AI-agent harness maturity gate. Prevents silent regression of the harness
  # itself (AGENTS.md, rules, commands, sensors) — deleting them now fails CI
  # instead of quietly dropping the score. Deterministic: no LLM/network calls.
  harness_score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Same target devs/agents run locally (make harness-score) — spec 36 same-harness
      - run: make harness-score

  # SCA — vulnerable dependencies in requirements.txt (no image build; fast PR feedback).
  dep_scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem (dependencies)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Configure git credentials for private deps
        env:
          DOCS_DEPLOY_TOKEN: ${{ secrets.DOCS_DEPLOY_TOKEN }}
        run: |
          git config --global credential.helper store
          printf "https://x-access-token:%s@github.com\n" "${DOCS_DEPLOY_TOKEN}" > ~/.git-credentials

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --quiet -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov ruff "fakeredis[lua]>=2.36,<3" "respx>=0.22,<0.23"

      - name: Run tests with coverage gate
        # Same command as the local harness (scripts/test-local.sh) — spec 36
        run: make test-ci
        env:
          REDIS_HOST: localhost
          SERVICE_NAME: test
          OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4317
          AWS_REGION: us-east-1
