name: Test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check src/ tests/

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Configure git credentials for private deps
        env:
          DOCS_DEPLOY_TOKEN: ${{ secrets.DOCS_DEPLOY_TOKEN }}
        run: |
          git config --global credential.helper store
          printf "https://x-access-token:%s@github.com\n" "${DOCS_DEPLOY_TOKEN}" > ~/.git-credentials

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --quiet -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov ruff

      - name: Run tests with coverage gate
        run: pytest tests/ --cov --cov-fail-under=90 --tb=short -q
        env:
          REDIS_HOST: localhost
          SERVICE_NAME: test
          OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4317
          AWS_REGION: us-east-1
