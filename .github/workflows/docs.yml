name: Docs

on:
  push:
    branches: [main]          # deploy to prod ONLY from main (Model A)
    paths:
      - "docs/site/**"
      - "mkdocs.yml"
  pull_request:
    branches: [main, dev]     # validate on PRs (no deploy)
    paths:
      - "docs/site/**"
      - "mkdocs.yml"
  workflow_dispatch:

# Least privilege. `contents: read` is sufficient even for the deploy job: the gh-pages push uses
# `personal_token: ${{ secrets.DOCS_DEPLOY_TOKEN }}` against the EXTERNAL repo
# StaffOps/staffops.github.io, not GITHUB_TOKEN — so no `contents: write` is needed here, and
# granting it would hand this workflow an unnecessary write over this repository (spec 45 T2.3).
permissions:
  contents: read

jobs:
  # PR lane: prove the site builds (broken nav/links fail --strict). No deploy.
  build_check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install mkdocs-material==9.5.39
      - run: mkdocs build --strict --site-dir site

  # Publish lane: only on push to main.
  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install mkdocs-material==9.5.39

      - name: Build docs
        run: mkdocs build --site-dir site

      - name: Deploy to staffops.github.io/aigent-squad/
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          personal_token: ${{ secrets.DOCS_DEPLOY_TOKEN }}
          external_repository: StaffOps/staffops.github.io
          publish_branch: gh-pages
          publish_dir: ./site
          destination_dir: aigent-squad
          keep_files: true
