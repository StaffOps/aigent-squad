  description: "HTTP bridge for MCP clients to the gateway /query (:8006)"
  annotations:
    github.com/project-slug: StaffOps/aigent-squad
    backstage.io/techdocs-ref: dir:.
  tags: [python, fastapi, mcp]
spec:
  type: service
  lifecycle: experimental
  owner: group:staffops
  system: aigent-squad
  consumesApis: [aigent-squad-gateway-api]
  dependsOn: [component:aigent-squad-gateway]
