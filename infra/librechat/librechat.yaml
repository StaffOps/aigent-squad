# LibreChat configuration — AIgent-squad as a custom OpenAI endpoint.
#
# Mount this at /app/librechat.yaml in the LibreChat container and set
# AIGENT_SQUAD_API_KEY to the squad's INTERNAL_API_TOKEN.
#
# The OpenAI-compatible bridge (spec 29) lives on the GATEWAY (:8000), not the
# supervisor — since spec 31 split the two tiers, the supervisor is
# backend-only (:8001, /internal/* only) and public /v1 routes moved to
# src/gateway/main.py. LibreChat talks to the gateway natively — no extra hop.
#
# baseURL is NOT env-templated — LibreChat only interpolates ${VAR} for
# specific fields (apiKey, headers values), not arbitrary ones (confirmed
# empirically: an untemplated baseURL loads as the literal string). REPLACE
# THE PLACEHOLDER BELOW with your squad's real public gateway URL. Common
# case: LibreChat runs local, the squad runs in a real cluster (only mongo +
# librechat need to run locally; see docker-compose.yaml). Point it at
# http://gateway:8000/v1 instead only when also running the full local stack
# (`make up`) with a fully-local squad.
version: 1.2.0
cache: true

endpoints:
  custom:
    - name: "AIgent-Squad"
      baseURL: "https://your-aigent-squad-host.example.com/v1"  # <- replace with your real gateway URL
      apiKey: "${AIGENT_SQUAD_API_KEY}"
      # The squad authenticates via X-Internal-Token, not a Bearer apiKey —
      # forward the key in that header.
      headers:
        X-Internal-Token: "${AIGENT_SQUAD_API_KEY}"
      models:
        # `fetch: true` pulls the live list from GET /v1/models:
        #   aigent-squad            → classifier auto-routes
        #   aigent-squad-<agent>    → force a specialist (aws, kubernetes, ...)
        default: ["aigent-squad"]
        fetch: true
      titleConvo: true
      titleModel: "aigent-squad"
      modelDisplayLabel: "AIgent-Squad"
