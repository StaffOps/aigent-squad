{{- if .Values.networkPolicy.enabled }}
---
# T5c: Gateway accepts ingress ONLY from the ingress controller
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-gateway
  labels:
    {{- include "aigent.labels" (dict "name" "gateway" "root" $) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "aigent.selectorLabels" (dict "name" "gateway") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressController.namespaceSelector | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressController.podSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.services.gateway.port }}
---
# T5c / T19: Supervisor accepts ingress on port 8001 ONLY from gateway pods.
# This covers /internal/* exposure — deny-all otherwise.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-supervisor
  labels:
    {{- include "aigent.labels" (dict "name" "supervisor" "root" $) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "aigent.selectorLabels" (dict "name" "supervisor") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gateway
              app.kubernetes.io/part-of: aigent-squad
      ports:
        - protocol: TCP
          port: {{ .Values.services.supervisor.port }}
{{- end }}
