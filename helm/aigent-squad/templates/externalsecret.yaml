{{- if .Values.externalSecrets.enabled }}
---
# Shared secrets (INTERNAL_API_TOKEN, REDIS_PASSWORD, etc.)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    {{- include "aigent.labels" (dict "name" "shared" "root" $) | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ .Release.Name }}-secrets
    creationPolicy: Owner
  data:
    {{- range .Values.externalSecrets.shared.keys }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ $.Values.externalSecrets.shared.remoteKey }}
        property: {{ . }}
    {{- end }}
---
# SUPERVISOR_INTERNAL_TOKEN — DISTINCT from INTERNAL_API_TOKEN (spec 31 T5b)
# This secret gates the supervisor /internal/* endpoints.
# Target end-state: file-mount (mode 0400) per cloud-security/12-factor.
# Current wiring: secretKeyRef (app reads pydantic env var). When the app
# supports file-based secret loading, switch to volume mount below.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-supervisor-internal-token
  labels:
    {{- include "aigent.labels" (dict "name" "supervisor-internal-token" "root" $) | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ .Release.Name }}-supervisor-internal-token
    creationPolicy: Owner
  data:
    - secretKey: SUPERVISOR_INTERNAL_TOKEN
      remoteRef:
        key: {{ .Values.externalSecrets.supervisorInternalToken.remoteKey }}
        property: {{ .Values.externalSecrets.supervisorInternalToken.key }}
{{- end }}
