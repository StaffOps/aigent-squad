{{- range $name, $svc := .Values.services }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aigent.fullname" (dict "name" $name "root" $) }}
  labels:
    {{- include "aigent.labels" (dict "name" $name "root" $) | nindent 4 }}
spec:
  type: {{ $svc.serviceType | default "ClusterIP" }}
  ports:
    - name: http
      port: {{ $svc.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "aigent.selectorLabels" (dict "name" $name) | nindent 4 }}
{{- end }}
