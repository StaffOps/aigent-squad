global:
  image:
    repository: harbor.bdc.app.br/aigent-squad/aigent-squad
    tag: ""  # defaults to .Chart.AppVersion
  environment: DEV
  costCenter: Platform-Infrastructure
  otelEndpoint: "http://otel-collector.monitoring:4317"
  awsRegion: us-east-1
  bedrockModelId: "us.anthropic.claude-sonnet-4-5-20250929-v1:0"

# --- Two-tier services (spec 31) ---
services:
  gateway:
    command: ["python", "-m", "src.gateway.main"]
    port: 8000
    public: true  # Ingress backend
    serviceType: ClusterIP
    replicas: 2
    scaling:
      enabled: true
      min: 2
      max: 10
      triggers:
        - type: prometheus
          metadata:
            serverAddress: "http://vmselect.monitoring:8481/select/0/prometheus"
            query: "sum(rate(http_server_request_duration_seconds_count{service_name='gateway'}[1m]))"
            threshold: "50"  # RPS per replica
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi

  supervisor:
    command: ["python", "-m", "src.supervisor.server"]
    port: 8001
    public: false  # ClusterIP internal only
    serviceType: ClusterIP
    replicas: 2
    scaling:
      enabled: true
      min: 2
      max: 10
      triggers:
        # TODO: Replace with Bedrock-concurrency metric when custom metric available
        - type: cpu
          metricType: Utilization
          metadata:
            value: "70"
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 1Gi

# --- Shared config ---
securityContext:
  runAsNonRoot: true
  runAsUser: 65534
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

terminationGracePeriodSeconds: 30

# --- External Secrets (spec 31 T5b) ---
externalSecrets:
  enabled: true
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  # Shared secrets
  shared:
    remoteKey: aigent-squad/shared
    keys:
      - INTERNAL_API_TOKEN
      - REDIS_PASSWORD
      - SLACK_BOT_TOKEN
      - SLACK_SIGNING_SECRET
      - GITLAB_TOKEN
      - DOCS_PORTAL_TOKEN
  # Supervisor internal token — DISTINCT from INTERNAL_API_TOKEN
  supervisorInternalToken:
    remoteKey: aigent-squad/supervisor-internal-token
    key: SUPERVISOR_INTERNAL_TOKEN

# --- Network Policies (spec 31 T5c / T19) ---
networkPolicy:
  enabled: true
  # The ingress controller label selector for gateway ingress
  ingressController:
    podSelector:
      app.kubernetes.io/name: ingress-nginx
    namespaceSelector:
      kubernetes.io/metadata.name: ingress-nginx

# --- Ingress ---
ingress:
  enabled: true
  className: alb
  annotations: {}
  hosts:
    - host: aigent.bdc.app.br
      paths:
        - path: /
          pathType: Prefix
  tls: []

# --- Env vars (non-sensitive, shared across tiers) ---
env:
  REDIS_HOST: "redis.aigent-squad.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_SSL: "true"
  DYNAMODB_SESSIONS_TABLE: "agent-sessions"
