name: finops
description: "FinOps/Cost specialist. Queries AWS Cost Explorer."
domain: cloud-costs
capabilities: [cost_analysis, budget_tracking, savings_recommendations]
routing_keywords: [cost, spend, budget, savings, billing, expensive, price, waste]
datasources:
  - type: boto3
    services: [ce]
cache:
  ttl: 3600
model:
  tier: standard
  temperature: 0.1
read_only: true
evidence_types: [cost_data]
delegates_to:
  - agent: aws
    when: "need resource details to attribute costs"
required_env: [AWS_REGION]
port: 8003
skills:
  - cost-explorer
  - ec2-rightsizing-patterns
  - kubecost-metrics
  - savings-plans-strategy
  - untagged-resources-bulk-fix
