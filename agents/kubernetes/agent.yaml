name: kubernetes
description: "Kubernetes cluster specialist. Queries pods, nodes, deployments, services."
domain: container-orchestration
capabilities: [pod_status, node_health, deployment_management, service_discovery]
routing_keywords: [pod, node, deployment, service, namespace, kubectl, k8s, cluster, replica, hpa]
datasources:
  # Access to the cluster via the kube-mcp server (mcp-servers namespace).
  # Caminho A of ADR-001: MCP-as-adapter, not autonomous tool-calling.
  # Transport: streamable-http (default since 2026-07-18; /mcp endpoint).
  #
  # Full tool catalog allowlisted (2026-07-13): kube-mcp's own protocol
  # surface is read-only — its tool catalog (queried live via
  # session.list_tools()) has no delete/exec/run/apply/patch tools at all,
  # only list/get/log/top/view. RBAC enforcement lives at the MCP server
  # itself (its ServiceAccount), so the app-level allowlist here is a
  # readability/audit aid, not the security boundary — no need to hand-curate
  # a subset. Re-check this comment if kube-mcp's tool catalog ever grows a
  # mutating tool; re-verify with session.list_tools() before trusting it.
  #
  # In-cluster Service DNS, not the external hostname: the supervisor runs in
  # the SAME cluster as kube-mcp, so this avoids an unnecessary round-trip
  # through the public ingress (extra latency + an extra failure domain).
  - type: mcp
    name: k8s-mcp
    url: http://kube-mcp.mcp-servers.svc.cluster.local:8080/mcp
    tools:
      - configuration_view
      - events_list
      - helm_list
      - kiali_get_logs
      - kiali_get_mesh_status
      - kiali_get_mesh_traffic_graph
      - kiali_get_metrics
      - kiali_get_pod_performance
      - kiali_get_resource_details
      - kiali_get_trace_details
      - kiali_list_traces
      - kiali_manage_istio_config_read
      - namespaces_list
      - nodes_log
      - nodes_stats_summary
      - nodes_top
      - pods_get
      - pods_list
      - pods_list_in_namespace
      - pods_log
      - pods_top
      - resources_get
      - resources_list
cache:
  ttl: 60
model:
  tier: standard
  temperature: 0.1
read_only: true
capability_tier: 0
evidence_types: [k8s_resource_state]
delegates_to:
  - agent: aws
    when: "issue involves EKS node provisioning or IAM"
  - agent: observability
    when: "need metrics to correlate with pod behavior"
port: 8002
skills:
  - aws-csi-driver-metrics
  - aws-load-balancer-controller-metrics
  - backing-services-metrics
  - cert-manager-metrics
  - descheduler-metrics
  - external-dns-metrics
  - external-secrets-aws-sm
  - external-secrets-metrics
  - helmfile-applicationset
  - helmfile-k8s-addon
  - helmfile-templating
  - ingress-nginx-metrics
  - istio-ambient-debugging
  - istio-ambient-metrics
  - istio-ambient-otel
  - k8s-pvc-tagger-metrics
  - k8s-workload-metrics
  - karpenter-consolidation
  - karpenter-metrics
  - keda-metrics
  - kubescape-metrics
  - kyverno-metrics
  - metrics-server-metrics
  - oomkill-investigation
  - reloader-metrics
  - scaleops-metrics
  - traefik-metrics
