name: kubernetes
description: "Kubernetes cluster specialist. Queries pods, nodes, deployments, services."
domain: container-orchestration
capabilities: [pod_status, node_health, deployment_management, service_discovery]
routing_keywords: [pod, node, deployment, service, namespace, kubectl, k8s, cluster, replica, hpa]
datasources:
  - type: kubernetes
cache:
  ttl: 60
model:
  tier: standard
  temperature: 0.1
read_only: true
evidence_types: [k8s_resource_state]
delegates_to:
  - agent: aws
    when: "issue involves EKS node provisioning or IAM"
  - agent: observability
    when: "need metrics to correlate with pod behavior"
port: 8002
