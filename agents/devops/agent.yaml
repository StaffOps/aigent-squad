name: devops
description: "DevOps specialist. Queries GitLab, documentation portal, CI/CD."
domain: development-operations
capabilities: [pipeline_status, code_search, documentation_search, deployment_history]
routing_keywords: [pipeline, deploy, ci, cd, gitlab, merge, branch, rollback, release, docs]
datasources:
  - type: http
    name: gitlab
    url: "${GITLAB_URL}/api/v4"
    headers:
      PRIVATE-TOKEN: "${GITLAB_TOKEN}"
  - type: http
    name: docs-portal
    url: "${DOCS_PORTAL_URL}"
cache:
  ttl: 300
model:
  tier: standard
  temperature: 0.1
read_only: true
evidence_types: [gitlab_search_result, documentation]
delegates_to:
  - agent: observability
    when: "deploy caused metric regression"
  - agent: kubernetes
    when: "need deployment/rollout status"
port: 8004
skills:
  - argo-events-metrics
  - argo-rollouts-metrics
  - argo-workflows-metrics
  - argocd-metrics
  - argocd-patterns
  - backstage-metrics
  - bdc-telemetry-helper
  - bdc-telemetry-standard
  - cosign-image-signing
  - crossplane-metrics
  - datahub-metrics
  - external-secrets-aws-sm
  - gitlab-runner-metrics
  - gitops-environment-onboard
  - harbor-metrics
  - helm-chart-app-bdc
  - helm-chart-cronworkflow-bdc
  - helmfile-applicationset
  - kyverno-bdc-policies
  - monitoring-stack-overview
  - nexus3-metrics
  - opensearch-metrics
  - pipeline-template-apps
  - sonarqube-metrics
  - strimzi-kafka-metrics
  - superset-metrics
  - terraform-modules-bdc
