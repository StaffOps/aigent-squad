services:
  # Redis for caching
  redis:
    image: redis:8.4-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-changeme}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # DynamoDB Local (for conversation history in dev)
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    ports:
      - "8100:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"

  # Postgres + pgvector (knowledge base for spec 21)
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      - POSTGRES_USER=aigent
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_DB=aigent_kb
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aigent -d aigent_kb"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Supervisor (backend — orchestration only; all agents in-process via GenericAgent).
  # No public port: only the gateway reaches it via /internal/* on 8001.
  supervisor:
    build:
      context: .
      dockerfile: Dockerfile
      ssh:
        - default
    command: ["python", "-m", "src.supervisor.server"]
    expose:
      - "8001"
    environment:
      - SERVICE_NAME=aigent-squad-supervisor
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      # Run BOTH exporters on the same MeterProvider (otel-helper v0.2.0+):
      # OTLP push through the collector (unchanged) AND the /metrics endpoint
      # mounted on the app itself (src/gateway/main.py, src/supervisor/server.py)
      # for direct Prometheus/VictoriaMetrics scrape. METRICS_PORT=0 disables
      # otel-helper's OWN standalone listener since we mount metrics_app() instead.
      - OTEL_METRICS_EXPORTER=otlp,prometheus
      - OTEL_HELPER_METRICS_PORT=0
      - ENVIRONMENT=LOCAL
      - AGENTS_DIR=/app/agents
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - BEDROCK_MODEL_ID=${BEDROCK_MODEL_ID:-us.anthropic.claude-sonnet-4-5-20250929-v1:0}
      - DYNAMODB_SESSIONS_TABLE=${DYNAMODB_SESSIONS_TABLE:-agent-sessions}
      - DYNAMODB_ENDPOINT=http://dynamodb-local:8000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_SSL=false
      - REDIS_PASSWORD=${REDIS_PASSWORD:-changeme}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:-dev-secret-token}
      - SUPERVISOR_INTERNAL_TOKEN=${SUPERVISOR_INTERNAL_TOKEN:-dev-internal-token}
      # Local default OFF (out-of-box run — spec 36): the app default is
      # fail-closed (true) and with no provisioned GUARDRAIL_ID every invoke
      # would be refused. Prod (Helm values) keeps fail-closed. To test the
      # guardrail locally: GUARDRAIL_ENABLED=true + GUARDRAIL_ID from
      # infra/terraform/guardrail outputs.
      - GUARDRAIL_ENABLED=${GUARDRAIL_ENABLED:-false}
      - GUARDRAIL_ID=${GUARDRAIL_ID:-}
      - GUARDRAIL_VERSION=${GUARDRAIL_VERSION:-DRAFT}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=aigent
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_DB=aigent_kb
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
      - SLACK_SIGNING_SECRET=${SLACK_SIGNING_SECRET}
      - GITLAB_TOKEN=${GITLAB_TOKEN}
      - GITLAB_URL=${GITLAB_URL:-https://gitlab.com}
      - DOCS_PORTAL_URL=${DOCS_PORTAL_URL:-https://docs.company.internal/}
      - PROMETHEUS_URL=${PROMETHEUS_URL:-http://prometheus:9090}
    volumes:
      - ${HOME}/.aws:/home/appuser/.aws:ro
      - ./agents:/app/agents:ro
    depends_on:
      redis:
        condition: service_healthy
      dynamodb-local:
        condition: service_started
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8001/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Gateway (public front door — edge auth, worker pool, admission, protocol).
  # Forwards to the supervisor; the only tier clients/LibreChat talk to.
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      ssh:
        - default
    command: ["python", "-m", "src.gateway.main"]
    ports:
      - "8000:8000"
    environment:
      - SERVICE_NAME=aigent-squad-gateway
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      # Run BOTH exporters on the same MeterProvider (otel-helper v0.2.0+):
      # OTLP push through the collector (unchanged) AND the /metrics endpoint
      # mounted on the app itself (src/gateway/main.py, src/supervisor/server.py)
      # for direct Prometheus/VictoriaMetrics scrape. METRICS_PORT=0 disables
      # otel-helper's OWN standalone listener since we mount metrics_app() instead.
      - OTEL_METRICS_EXPORTER=otlp,prometheus
      - OTEL_HELPER_METRICS_PORT=0
      - ENVIRONMENT=LOCAL
      - SUPERVISOR_URL=http://supervisor:8001
      - SUPERVISOR_INTERNAL_TOKEN=${SUPERVISOR_INTERNAL_TOKEN:-dev-internal-token}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:-dev-secret-token}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_SSL=false
      - REDIS_PASSWORD=${REDIS_PASSWORD:-changeme}
      - GATEWAY_MAX_CONCURRENT=${GATEWAY_MAX_CONCURRENT:-20}
      - RATE_BUDGET_ENABLED=${RATE_BUDGET_ENABLED:-true}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-60}
      - DAILY_BUDGET_USD=${DAILY_BUDGET_USD:-50.0}
    depends_on:
      supervisor:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MCP Server (HTTP gateway for Kiro CLI) — talks to the edge gateway's /query
  mcp-server:
    build:
      context: .
      dockerfile: mcp-server/Dockerfile
      ssh:
        - default
    ports:
      - "8006:8006"
    environment:
      - SUPERVISOR_URL=http://gateway:8000/query
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:-dev-secret-token}
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8006/ready"]
      interval: 10s
      timeout: 5s
      retries: 3

  # --- LibreChat (spec 29 bridge validation — docs/LIBRECHAT.md) ---

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Runs standalone against the REAL devops-core squad by default (only mongo
  # is a local dependency — gateway/supervisor are NOT started for this).
  # `docker compose up -d mongo librechat` is enough; no need for `make up`.
  # To point at a fully-local squad instead, override AIGENT_SQUAD_BASE_URL to
  # http://gateway:8000/v1 and bring up the full stack (`make up`) too.
  librechat:
    image: ghcr.io/danny-avila/librechat:latest
    ports:
      - "3080:3080"
    environment:
      - HOST=0.0.0.0
      - MONGO_URI=mongodb://mongo:27017/LibreChat
      - ENDPOINTS=custom
      - ALLOW_REGISTRATION=true
      - NO_INDEX=true
      # Dev-only throwaway secrets (single-user local testing, not sensitive).
      - JWT_SECRET=${LIBRECHAT_JWT_SECRET:-9c8189d30bc1b50090fa8175ec91610183d632484602b95b0ab8dd493ba17cd5}
      - JWT_REFRESH_SECRET=${LIBRECHAT_JWT_REFRESH_SECRET:-770c5fc01057dfd28051ce59e6df1474efda982000e49f4da57b315940b92343}
      - CREDS_KEY=${LIBRECHAT_CREDS_KEY:-75e847bef2df3dc883bd365d2aae4cfdba329dd12e49800123c1447981d4c9db}
      - CREDS_IV=${LIBRECHAT_CREDS_IV:-aadf8c9ff2131a61b8306ede1a097383}
      # baseURL is hardcoded in infra/librechat/librechat.yaml (LibreChat
      # doesn't template that field — see the comment there). This must be
      # the real gateway edge-auth token (STAFFOPS_AIGENT_SQUAD secret,
      # property internal-api-token) unless you've edited that file to point
      # at a local gateway instead, in which case dev-secret-token works.
      # Kept as a separate var from INTERNAL_API_TOKEN (used by
      # supervisor/gateway below) so an unset value here never breaks
      # `make up`'s full local stack.
      - AIGENT_SQUAD_API_KEY=${LIBRECHAT_AIGENT_SQUAD_API_KEY:-dev-secret-token}
    volumes:
      - ./infra/librechat/librechat.yaml:/app/librechat.yaml:ro
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Observability Stack ---

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.154.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - tempo

  tempo:
    image: grafana/tempo:2.10.7
    volumes:
      - ./infra/observability/tempo.yaml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo
    command: ["-config.file=/etc/tempo/config.yaml"]

  prometheus:
    image: prom/prometheus:v3.11.3
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-remote-write-receiver"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    volumes:
      - ./infra/observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9099:9090"

  grafana:
    image: grafana/grafana:13.0.2
    ports:
      - "3001:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - tempo
      - prometheus

volumes:
  redis-data:
  tempo-data:
  postgres-data:
  mongo-data:
